<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@pian | Official Links</title>
  <link rel="stylesheet" href="https://cloudflare.com">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-image: linear-gradient(
          to bottom,
          rgba(10, 25, 47, 0.25) 0%,
          rgba(5, 10, 20, 0.85) 55%,
          #05070a 100%
        ),
        url('SAVE_20261115_100110.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 24px 16px 48px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .share-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      border: none;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      background-color: #1e293b;
    }

    .username {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .bio {
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.45;
      max-width: 320px;
      margin-bottom: 18px;
      color: #f8fafc;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .social-icons {
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
    }

    .social-icons a {
      color: #ffffff;
      font-size: 1.55rem;
      transition: transform 0.2s ease;
    }

    .social-icons a:hover {
      transform: scale(1.15);
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 62px;
      padding: 8px 18px 8px 10px;
      border-radius: 999px;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .link-pill:hover {
      transform: scale(1.02);
      background: rgba(255, 255, 255, 0.14);
    }

    .pill-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }

    .icon-ig {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-tiktok {
      color: #000000;
      text-shadow: -1.5px -1.5px 0 #25F4EE, 1.5px 1.5px 0 #FE2C55;
    }

    .icon-discord {
      color: #5865F2;
    }

    .pill-text {
      text-align: center;
      padding: 0 10px;
    }

    .pill-title {
      font-size: 0.98rem;
      font-weight: 700;
      display: block;
    }

    .pill-subtitle {
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-top: 2px;
      display: block;
    }

    .pill-dots {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.95rem;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <button class="share-btn" onclick="copyLink()" title="Salin Link">
        <i class="fa-solid fa-arrow-up-from-bracket"></i>
      </button>
    </div>

    <img src="https://dicebear.com" alt="Foto Profil" class="avatar">

    <div class="username">@pian</div>
    <p class="bio">if you wanna know me more, you can click on one of the link below &lt;3</p>

    <div class="social-icons">
      <a href="https://www.instagram.com/pian.s09?exln=MWFpOHl1ZWUzYzkzZQ%3D%3D&utm_source=qr" target="_blank"><i class="fa-brands fa-instagram"></i></a>
      <a href="https://www.tiktok.com/@renxixix0?_r=1&_t=ZS-9BPgBwqx2fs" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
      <a href="https://discord.gg/AGXBCVd3g9" target="_blank"><i class="fa-brands fa-discord"></i></a>
    </div>

    <div class="links-list">
      <a href="https://www.instagram.com/pian.s09?exln=MWFpOHl1ZWUzYzkzZQ%3D%3D&utm_source=qr" target="_blank" class="link-pill">
        <div class="pill-icon"><i class="fa-brands fa-instagram icon-ig"></i></div>
        <div class="pill-text"><span class="pill-title">Instagram</span></div>
        <i class="fa-solid fa-ellipsis-vertical pill-dots"></i>
      </a>

      <a href="https://www.tiktok.com/@renxixix0?_r=1&_t=ZS-9BPgBwqx2fs" target="_blank" class="link-pill">
        <div class="pill-icon"><i class="fa-brands fa-tiktok icon-tiktok"></i></div>
        <div class="pill-text"><span class="pill-title">TikTok</span></div>
        <i class="fa-solid fa-ellipsis-vertical pill-dots"></i>
      </a>

      <a href="https://discord.gg/AGXBCVd3g9" target="_blank" class="link-pill">
        <div class="pill-icon"><i class="fa-brands fa-discord icon-discord"></i></div>
        <div class="pill-text">
          <span class="pill-title">Discord</span>
          <span class="pill-subtitle">Discord Server • Free to join</span>
        </div>
        <i class="fa-solid fa-ellipsis-vertical pill-dots"></i>
      </a>
    </div>

    <div class="footer">© 2026 @pian</div>
  </div>

  <script>
    function copyLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('Link website berhasil disalin!');
    }
  </script>

</body>
</html>
