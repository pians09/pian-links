<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@pian | Anime Developer Portfolio</title>
  <style>
    :root {
      --bg-base: #09080d;
      --bg-card: #13111c;
      --bg-glass: rgba(19, 17, 28, 0.85);
      --accent: #f43f5e;
      --accent-soft: rgba(244, 63, 94, 0.16);
      --accent-glow: rgba(244, 63, 94, 0.45);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      scroll-behavior: smooth;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(244, 63, 94, 0.14), transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(139, 92, 246, 0.12), transparent 45%);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Floating Pill Navbar */
    .navbar-wrap {
      position: fixed;
      top: 18px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
    }

    .nav-pill {
      pointer-events: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      padding: 10px 26px;
      border-radius: 999px;
      display: flex;
      gap: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .nav-pill a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      transition: 0.25s;
    }

    .nav-pill a:hover {
      color: var(--accent);
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* 1. Hero Section */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 90px;
      padding-bottom: 50px;
      gap: 36px;
    }

    .hero-left {
      flex: 1;
      min-width: 280px;
    }

    .subtitle {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .hero-left h1 {
      font-size: clamp(2.2rem, 4.5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .hero-left h1 span {
      color: var(--accent);
      text-shadow: 0 0 25px var(--accent-glow);
    }

    .hero-left p {
      color: var(--text-muted);
      max-width: 490px;
      margin-bottom: 26px;
      font-size: 0.95rem;
    }

    .btn-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      padding: 11px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 6px 20px var(--accent-glow);
      transition: 0.3s;
      display: inline-block;
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      padding: 11px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      transition: 0.3s;
      display: inline-block;
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hero-right {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .anime-frame {
      width: 250px;
      height: 290px;
      border-radius: 24px;
      padding: 5px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 35px var(--accent-glow);
      animation: floatAnime 4s ease-in-out infinite;
    }

    @keyframes floatAnime {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .anime-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      display: block;
    }

    /* 2. About Section - Simetris 3 Kolom */
    .section {
      padding: 85px 0;
    }

    .section-heading {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .section-heading span {
      color: var(--accent);
    }

    .section-desc {
      text-align: center;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 44px;
      font-size: 0.94rem;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 32px;
    }

    .about-left h2 {
      font-size: 2rem;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .about-left h2 span {
      color: var(--accent);
    }

    .about-role {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .about-center {
      display: flex;
      justify-content: center;
    }

    .about-center img {
      width: 230px;
      height: 280px;
      object-fit: cover;
      border-radius: 22px;
      border: 1px solid rgba(244, 63, 94, 0.35);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85), 0 0 25px rgba(244, 63, 94, 0.2);
    }

    .about-right p {
      color: var(--text-muted);
      margin-bottom: 14px;
      font-size: 0.92rem;
    }

    /* 3. Portfolio Section */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .tab-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      transition: 0.25s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
    }

    .project-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .card-thumb {
      width: 100%;
      height: 150px;
      background: #0c0a12;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.3s;
    }

    .project-card:hover .card-thumb img {
      transform: scale(1.05);
    }

    .card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .project-card h3 {
      font-size: 1.12rem;
      margin-bottom: 8px;
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.86rem;
      margin-bottom: 18px;
    }

    .card-link {
      display: inline-block;
      width: fit-content;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.06);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.25s;
    }

    .card-link:hover {
      background: var(--accent);
    }

    /* 4. Music Section */
    .music-wrap {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      align-items: center;
      gap: 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 32px;
    }

    .music-left h2 {
      font-size: 2rem;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .music-left h2 span {
      color: var(--accent);
    }

    .music-left p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 22px;
    }

    /* Modal Popup Detail Proyek */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 18px;
      max-width: 460px;
      width: 100%;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px var(--accent-glow);
    }

    .modal-tag {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .modal-box h3 {
      font-size: 1.35rem;
      margin-bottom: 10px;
    }

    .modal-box p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 20px;
    }

    footer {
      text-align: center;
      padding: 28px;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 720px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }
      .btn-group {
        justify-content: center;
      }
      .about-grid, .cards-grid, .music-wrap {
