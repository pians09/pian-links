<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20 Min - Lil Uzi Vert (Code Lyrics)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #0b0a10;
      background-image: radial-gradient(circle at 50% 20%, rgba(168, 85, 247, 0.16), transparent 55%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .terminal-box {
      width: 100%;
      max-width: 680px;
      background: #13111c;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 30px rgba(168, 85, 247, 0.2);
      overflow: hidden;
    }

    .terminal-header {
      background: #1c1929;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .red { background: #ef4444; }
    .yellow { background: #eab308; }
    .green { background: #22c55e; }

    .file-title {
      font-size: 0.85rem;
      color: #a855f7;
      font-weight: bold;
    }

    .code-area {
      padding: 24px;
      min-height: 310px;
      font-size: 0.95rem;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .kw { color: #c084fc; font-weight: bold; }
    .str { color: #4ade80; }
    .num { color: #f472b6; }
    .cmt { color: #64748b; font-style: italic; }

    .controls {
      padding: 16px 24px;
      background: #181524;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    button {
      background: #a855f7;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
      font-family: sans-serif;
    }

    button:hover {
      background: #9333ea;
      transform: translateY(-2px);
    }

    .spotify-mini {
      width: 100%;
      max-width: 680px;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div class="terminal-box">
    <div class="terminal-header">
      <div class="dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div class="file-title">20_min_lil_uzi.js</div>
      <div style="font-size: 0.75rem; color: #94a3b8;">UTF-8</div>
    </div>

    <div class="code-area" id="layarKode"><span class="cmt">// Klik tombol "Run Track" untuk menjalankan lirik kode...</span></div>

    <div class="controls">
      <button onclick="mulaiLirik()">&#9654; Run Track</button>
      <a href="portofolio.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem; font-family: sans-serif;">&larr; Kembali ke Portfolio</a>
    </div>
  </div>

  <!-- Pemutar Spotify Track 20 Min -->
  <div class="spotify-mini">
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/0uxSUdBrJy9Un0EYoBowng?si=9px5pSzfSxOvcnY0hCBBcw&utm_source=copy-link" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>

  <script>
    const barisLirik = [
      '<span class="cmt">// Track: 20 Min — Lil Uzi Vert (Code Edition)</span>',
      '<span class="kw">let</span> waktuTersisa = <span class="num">20</span>; <span class="cmt">// menit sebelum acara dimulai</span>',
      '<span class="kw">const</span> status = <span class="str">"Said she wanna roll with me"</span>;',
      '',
      '<span class="kw">function</span> jalankanMalamIni(menit) {',
      '  <span class="kw">if</span> (menit === <span class="num">20</span>) {',
      '    console.log(<span class="str">"I got 20 more minutes until I gotta go..."</span>);',
      '    console.log(<span class="str">"So I told that girl that she gonna slaughter"</span>);',
      '  }',
      '  <span class="kw">while</span> (waktuTersisa > <span class="num">0</span>) {',
      '    nikmatiBeat(<span class="str">"Luv Is Rage 2"</span>);',
      '    waktuTersisa--;',
      '  }',
      '}',
      '',
      'jalankanMalamIni(waktuTersisa);',
      '<span class="cmt">// Process finished with exit code 0 (Vibe Complete)</span>'
    ];

    let sedangJalan = false;

    function mulaiLirik() {
      if (sedangJalan) return;
      sedangJalan = true;
      const layar = document.getElementById("layarKode");
      layar.innerHTML = "";
      let indeks = 0;

      const interval = setInterval(() => {
        if (indeks < barisLirik.length) {
          layar.innerHTML += barisLirik[indeks] + "\n";
          indeks++;
        } else {
          clearInterval(interval);
          sedangJalan = false;
        }
      }, 450);
    }
  </script>

</body>
</html>
