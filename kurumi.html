<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@pian | Kurumi Tokisaki</title>
  <style>
    body {
      background-color: #141216;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .widget-card {
      background-color: #1f1b24;
      border-radius: 16px;
      width: 340px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(220, 38, 38, 0.25);
      border: 1px solid #4c1d24;
    }
    .banner {
  width: 100%;
  height: auto;
  display: block;
}
    
    .content {
      padding: 16px;
    }
    .badge {
      background-color: #dc2626;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h2 {
      margin: 10px 0 4px;
      font-size: 20px;
    }
    p {
      color: #b5bac1;
      font-size: 14px;
      margin: 0 0 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .grid-item {
      background-color: #141216;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #2e2633;
    }
    .grid-item img {
      width: 85px;
      height: 85px;
      border-radius: 8px;
      object-fit: cover;
    }
    .grid-item span {
      display: block;
      font-size: 13px;
      margin-top: 8px;
      font-weight: 600;
    }
    .back-btn {
      display: block;
      text-align: center;
      margin-top: 16px;
      padding: 10px;
      background-color: #dc2626;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="widget-card">
    <img class="banner" src="SAVE_20261115_100110.jpg" alt="Kurumi Banner">
    
    <div class="content">
      <span class="badge">My Kisah</span>
      <h2>Kurumi Tokisaki</h2>
      <p>My Bini &bull; Status: Lagi Nemenin @pian Ngoding</p>

      <div class="grid">
        <div class="grid-item">
          <img src="SAVE_20261115_100110.jpg" alt="Kurumi 1">
          <span>Kurumi #1</span>
        </div>
        <div class="grid-item">
          <img src="SAVE_20261115_103401.jpg" alt="Kurumi 2">
          <span>Kurumi #2</span>
        </div>
      </div>

      <a class="back-btn" href="index.html">&larr; Kembali ke Official Links</a>
    </div>
  </div>

</body>
</html>
